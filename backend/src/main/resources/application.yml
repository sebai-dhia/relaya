spring:
  application:
    name: relaya-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/relaya}
    username: ${DATABASE_USER:relaya}
    password: ${DATABASE_PASSWORD:relaya}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RelayaPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 50
      thread-name-prefix: relaya-async-

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /

relaya:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-not-for-production-use-at-least-256-bits-long-random}
    access-token-expiry-seconds: 3600
    sse-token-expiry-seconds: 300

  ai:
    monthly-budget-usd: ${MONTHLY_BUDGET_USD:5.00}
    max-tokens-per-call: ${MAX_TOKENS_PER_CALL:4000}

  retention:
    days: ${RETENTION_DAYS:90}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  trello:
    api-key: ${TRELLO_API_KEY:}
    token: ${TRELLO_TOKEN:}
    board-id: ${TRELLO_BOARD_ID:}

logging:
  level:
    com.relaya: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.stat: WARN
    org.hibernate.type.descriptor.sql: WARN