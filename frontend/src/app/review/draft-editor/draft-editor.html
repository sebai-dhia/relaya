<div class="editor-container surface-card">
  <div class="editor-header">
    <div>
      <h3 class="editor-title">Edit Draft Deliverables & Scope</h3>
      <p class="editor-desc">
        Modifying any field re-calculates the content hash and immediately invalidates existing approvals.
      </p>
    </div>
    <div class="editor-actions">
      <button type="button" class="btn btn-secondary" (click)="cancelEdit.emit()">Cancel</button>
      <button type="button" class="btn btn-primary" (click)="onSave()" [disabled]="saving()">
        @if (saving()) {
          <span>Saving Changes...</span>
        } @else {
          <span>Save & Recompute Hash</span>
        }
      </button>
    </div>
  </div>

  <form class="editor-form">
    <div class="field-group">
      <label>Deliverables (One item per line):</label>
      <textarea
        rows="5"
        [(ngModel)]="deliverablesText"
        name="deliverables"
        class="form-textarea"
      ></textarea>
    </div>

    <div class="field-group">
      <label>Core Objectives (One item per line):</label>
      <textarea
        rows="5"
        [(ngModel)]="objectivesText"
        name="objectives"
        class="form-textarea"
      ></textarea>
    </div>

    <div class="field-group">
      <label>Timeline & Budget Notes:</label>
      <div class="two-col">
        <input
          type="text"
          [(ngModel)]="timelineNotes"
          name="timeline"
          placeholder="Timeline notes"
          class="form-input"
        />
        <input
          type="text"
          [(ngModel)]="budgetNotes"
          name="budget"
          placeholder="Budget notes"
          class="form-input"
        />
      </div>
    </div>
  </form>

  <div class="editor-danger-zone">
    <div class="danger-zone-content">
      <div class="danger-icon-badge">
        <svg class="icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <div class="danger-zone-text">
        <div class="danger-header-line">
          <span class="danger-badge">DANGER ZONE</span>
          <span class="danger-title">Delete Intake Brief</span>
        </div>
        <p class="danger-zone-help">
          Permanently delete this intake brief, all extraction drafts, version snapshots, and audit trail. This action cannot be undone.
        </p>
      </div>
    </div>
    <div class="danger-zone-action">
      <button
        type="button"
        class="btn btn-danger-action"
        (click)="deleteTrigger.emit()"
      >
        <svg class="icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
        </svg>
        <span>Delete Brief</span>
      </button>
    </div>
  </div>
</div>
